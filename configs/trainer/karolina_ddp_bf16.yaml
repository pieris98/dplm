# Karolina multi-node DDP trainer config (torchrun-launched, one task per node).
#
# Launch chain: sbatch -> srun (1 task/node, all 8 GPUs in the task cgroup) ->
# train_rank.sh -> torchrun --nnodes=2 --nproc_per_node=8 (inside the sandbox).
# torchrun sets every worker's RANK/LOCAL_RANK/WORLD_SIZE/TORCHELASTIC_* env,
# and Lightning auto-detects TorchElasticEnvironment
# (torch.distributed.is_torchelastic_launched()) — the explicit structured
# strategy below pins that deterministically. num_nodes(2) x devices(8) = 16
# == WORLD_SIZE, satisfying SubprocessScriptLauncher.validate_settings.
# train_rank.sh passes trainer.num_nodes/devices explicitly (physical truth);
# the 1/1 defaults here are only for single-process fallbacks.
defaults:
  - default.yaml

accelerator: "cuda"
devices: 8
num_nodes: 2
strategy:
  _target_: pytorch_lightning.strategies.DDPStrategy
  find_unused_parameters: true # = the old 'ddp_find_unused_parameters_true'
  cluster_environment:
    _target_: lightning_fabric.plugins.environments.TorchElasticEnvironment
precision: "bf16"
sync_batchnorm: true

min_epochs: 1
max_epochs: 10000
max_steps: 100000
gradient_clip_val: 0.5
accumulate_grad_batches: 1

enable_progress_bar: true
log_every_n_steps: 10
val_check_interval: 500
check_val_every_n_epoch: null
num_sanity_val_steps: 1

use_distributed_sampler: false
reload_dataloaders_every_n_epochs: 1
