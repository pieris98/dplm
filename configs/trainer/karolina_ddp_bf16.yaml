# Karolina multi-node DDP trainer config (one task per GPU, externally launched).
#
# The srun step in scripts/karolina/cond_dplm2_train_multinode.sbatch launches
# one train.py task per GPU; train_rank.sh forwards the torch env-init vars
# (RANK/LOCAL_RANK/WORLD_SIZE/MASTER_ADDR/MASTER_PORT) into the container.
# A structured TorchElasticEnvironment consumes exactly those vars and sets
# creates_processes_externally=True, so Lightning joins the env:// world
# instead of treating each task as its own single-process world (the string
# 'ddp_find_unused_parameters_true' cannot carry a custom cluster environment
# — smoke jobs 5259770/5259788/5259770: 16 independent world-1 trainings,
# probe firing on two "rank 0"s, both nodes writing the same ckpt file).
# num_nodes/devices stay 1 per task: the env world (16) is authoritative.
defaults:
  - default.yaml

accelerator: "cuda"
devices: 1
num_nodes: 1
strategy:
  _target_: pytorch_lightning.strategies.DDPStrategy
  find_unused_parameters: true # = the old 'ddp_find_unused_parameters_true'
  cluster_environment:
    _target_: lightning_fabric.plugins.environments.TorchElasticEnvironment
precision: "bf16"
sync_batchnorm: true

min_epochs: 1
max_epochs: 10000
max_steps: 100000
gradient_clip_val: 0.5
accumulate_grad_batches: 1

enable_progress_bar: true
log_every_n_steps: 10
val_check_interval: 500
check_val_every_n_epoch: null
num_sanity_val_steps: 1

use_distributed_sampler: false
reload_dataloaders_every_n_epochs: 1
