# @package _global_

# Conditional DPLM-2: CFP-Gen-style annotation conditioning on top of a
# frozen pretrained DPLM-2 650M. Trains only the parallel adapters +
# annotation embedders + projection MLPs.

defaults:
  - /callbacks: lm
  - /trainer: ddp_bf16

project: "CondDPLM2_650m"
name: "cond_dplm2_650m_cfpgen"

datamodule:
  _target_: annotated_protein
  parquet_path: ${paths.data_dir}/cfpgen_dplm2_joined/joined_train_safe.parquet
  vocab_file: airkingbd/dplm2_650m
  max_tokens: 4000
  max_len: 512
  num_workers: 4
  val_ratio: 0.05
  split_seed: 0

model:
  _target_: conditional_dplm2
  num_diffusion_timesteps: 500
  gradient_ckpt: false
  training_stage: continue_train_from_dplm2
  single_modality_ratio: 0.25
  folding_loss_ratio: 0.25
  inverse_folding_loss_ratio: 0.25
  joint_loss_ratio: 0.25
  independent_loss_ratio: 0.0
  # No LoRA — base is fully frozen; only adapters/embedders/projectors train.
  lora:
    enable: false
    lora_rank: 16
    lora_dropout: 0.1
    lora_target_module: (esm.encoder.layer.[0-9]*.attention.(self.query|self.key|self.value|output.dense).*|esm.encoder.layer.[0-9]*.(intermediate|output).dense.*)
    modules_to_save: lm_head,esm.embeddings
  net:
    arch_type: esm
    name: airkingbd/dplm2_650m
    dropout: 0.1
    pretrain: false
    pretrained_model_name_or_path: airkingbd/dplm2_650m
  self_mixup:
    enable: false
    with_original_loss: false
  tokenizer:
    vocab_file: ${datamodule.vocab_file}
    vocab_size: 33
  struct_tokenizer:
    exp_path: airkingbd/struct_tokenizer
  # ConditionalDPLM2-specific config: parallel-adapter annotation conditioning.
  conditioning:
    annotations:
      vocab_sizes:
        ipr: 1154
        go: 375
      embed_dim: 128
      p_dropout_uncond: 0.1
    adapter:
      layer_indices: null        # null = adapter at every layer
      c_s: 128
      c_hidden: 16
      low_rank_cond: true
      low_rank_mlp: true
      adapter_summation: false
      dropout_rate: 0.1
      weight_init: 1.0e-5
      adapter_nlayers: 2
      proj_hidden_dim: 128
    external:
      enable: false
      input_dim: 0
    freeze_base: true

task:
  _target_: lm/conditional_dplm2
  learning:
    watch_t1_t2_loss: false
    cal_constant_loss: true
    weight: linear
  criterion:
    _target_: byprot.modules.cross_entropy.StructAARDMCrossEntropyLoss
    label_smoothing: 0.0
    ignore_index: 1
  optimizer:
    type: adamw
    _partial_: true
    lr: ${train.lr}
    betas:
      - 0.9
      - 0.98
    weight_decay: 0.01
  lr_scheduler:
    type: polynomial
    warmup_steps: 500
    total_steps: ${trainer.max_steps}
    lr: ${train.lr}
    lr_end: 1e-5
    warmup_init_lr: 1e-07
    power: 1

train:
  seed: 42
  lr: 1e-3      # higher than DPLM-2's 1e-4 because only adapters train
  monitor: "val/loss"
  mode: "min"
  patience: 1000

trainer:
  min_epochs: 1
  max_epochs: 10000
  gradient_clip_val: 0.5
  num_sanity_val_steps: 1
  use_distributed_sampler: false
  max_steps: 100_000
  accumulate_grad_batches: 1
  check_val_every_n_epoch: null
  val_check_interval: 500
  enable_progress_bar: true
  num_nodes: 1
